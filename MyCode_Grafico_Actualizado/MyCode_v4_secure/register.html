<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — MyCode</title><link rel="stylesheet" href="/css/styles.css"></head><body data-page="register"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">&lt;/&gt;</span><span>My<span>Code</span></span></a><div class="header-actions"><button class="back-btn" data-back data-i18n="nav.back"></button><div class="header-tools"><div class="language-switch"><button data-lang="es">ES</button><span>|</span><button data-lang="en">EN</button></div><button class="icon-btn" data-theme-toggle></button></div></div></header><main class="auth-main"><section class="auth-card"><div class="auth-icon">+</div><span class="eyebrow" data-i18n="auth.registerEyebrow"></span><h1 data-i18n="auth.registerTitle"></h1><p class="muted" data-i18n="auth.registerIntro"></p><form id="registerForm" novalidate><div class="field-group"><label for="username" data-i18n="auth.username"></label><input id="username" name="username" maxlength="30" autocomplete="username" required><small class="field-error" data-error-for="username"></small></div><div class="field-group"><label for="email" data-i18n="auth.email"></label><input id="email" name="email" type="email" maxlength="160" autocomplete="email" required><small class="field-error" data-error-for="email"></small></div><div class="field-row"><div class="field-group"><label for="birthDate" data-i18n="auth.birthDate"></label><input id="birthDate" name="birthDate" type="date" required><small class="field-error" data-error-for="birthDate"></small></div><div class="field-group"><label for="userType" data-i18n="auth.userType"></label><select id="userType" name="userType" required><option value="" selected></option><option value="student" data-i18n="auth.student"></option><option value="general" data-i18n="auth.general"></option></select><small class="field-error" data-error-for="userType"></small></div></div><div class="field-row"><div class="field-group"><label for="registerPassword" data-i18n="auth.password"></label><div class="password-wrap"><input id="registerPassword" name="password" type="password" maxlength="128" autocomplete="new-password" required aria-describedby="registerPasswordError"><button type="button" class="password-toggle" data-password-toggle aria-controls="registerPassword"><span data-eye-icon aria-hidden="true">◌</span><span class="sr-only" data-i18n="auth.showPassword"></span></button></div><small class="field-error" id="registerPasswordError" data-error-for="registerPassword"></small></div><div class="field-group"><label for="confirmPassword" data-i18n="auth.confirmPassword"></label><div class="password-wrap"><input id="confirmPassword" name="confirmPassword" type="password" maxlength="128" autocomplete="new-password" required aria-describedby="confirmPasswordError"><button type="button" class="password-toggle" data-password-toggle aria-controls="confirmPassword"><span data-eye-icon aria-hidden="true">◌</span></button></div><small class="field-error" id="confirmPasswordError" data-error-for="confirmPassword"></small></div></div><button class="btn btn-primary btn-full" type="submit" data-i18n="auth.create"></button><p id="registerMessage" class="form-message" role="status"></p></form><p class="switch-link"><span data-i18n="auth.already"></span> <a href="login.html" data-i18n="nav.login"></a></p></section></main><script type="module" src="/src/js/main.js"></script></body></html>
