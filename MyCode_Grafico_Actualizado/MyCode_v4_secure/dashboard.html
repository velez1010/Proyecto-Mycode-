<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — MyCode</title><link rel="stylesheet" href="/css/styles.css"></head><body data-page="dashboard"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">&lt;/&gt;</span><span>My<span>Code</span></span></a><nav class="top-nav"><span data-member-nav><a href="dashboard.html" data-i18n="nav.dashboard"></a><a href="index.html#courses" data-i18n="nav.courses"></a><a href="plans.html" data-i18n="nav.plans"></a><b data-nav-user></b><button class="btn btn-outline btn-small" data-logout data-i18n="nav.logout"></button></span><div class="header-tools"><div class="language-switch"><button data-lang="es">ES</button><span>|</span><button data-lang="en">EN</button></div><button class="icon-btn" data-theme-toggle></button><button class="back-btn" data-back data-i18n="nav.back"></button></div></nav></header><main id="dashboardPage"><section class="dashboard-hero"><div><span class="eyebrow" data-i18n="dashboard.eyebrow"></span><h1><span data-i18n="dashboard.hello"></span> <strong data-user-name>...</strong></h1><p class="muted" data-i18n="dashboard.intro"></p></div><div class="plan-pill" id="currentPlan"></div></section><div class="dashboard-grid"><div class="stack"><div id="tokenAlert"></div><section class="panel wallet-panel"><div><span class="eyebrow" data-i18n="dashboard.wallet"></span><h2 data-i18n="dashboard.tokensTitle"></h2></div><strong id="walletLabel" class="wallet-number"></strong><div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="progressFill" class="progress-fill"></div></div><small id="walletSub" class="muted"></small></section><section class="panel"><div class="panel-title"><h2 data-i18n="dashboard.currentPlan"></h2><a class="text-link" href="plans.html" data-i18n="nav.plans"></a></div><div class="stats-grid"><div class="stat-card"><span data-i18n="dashboard.available"></span><strong id="availableTokens"></strong></div><div class="stat-card"><span data-i18n="dashboard.used"></span><strong id="usedTokens"></strong></div><div class="stat-card"><span data-i18n="dashboard.renewal"></span><strong><span id="renewalDate"></span> <small data-i18n="dashboard.days"></small></strong></div></div></section><section class="panel"><div class="panel-title"><h2 data-i18n="dashboard.history"></h2></div><div class="table-wrap"><table class="history-table"><thead><tr><th data-i18n="dashboard.date"></th><th data-i18n="dashboard.action"></th><th data-i18n="dashboard.tokens"></th></tr></thead><tbody id="historyBody"></tbody></table></div></section></div><aside class="stack"><section class="panel plan-side"><span class="eyebrow" data-i18n="dashboard.currentPlan"></span><h2 id="planBadge"></h2><ul id="planBenefitList" class="benefits"></ul><a class="btn btn-primary btn-full" href="plans.html" data-i18n="nav.plans"></a></section><section class="panel"><a class="btn btn-outline btn-full" href="index.html#courses" data-i18n="dashboard.explore"></a></section></aside></div></main><script type="module" src="/src/js/main.js"></script></body></html>
